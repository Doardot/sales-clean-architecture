spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: ImpostoService
          uri: lb://IMPOSTOSERVICE
          predicates:
            - Path=/impostos/**
        - id: Api
          uri: lb://API
          predicates:
            - Path=/api/**
server:
  port: 8765
eureka:
  client:
    serviceUrl:
      defaultZone: http://naming-server:8761/eureka
spring:
  rabbitmq:
    host: rabbitmq
